<script>
(() => {

    stage.style.setProperty('--fold', (r.bottom - s.top) + 'px');
    clipBands = matchMedia('(max-width: 760px)').matches ? [[0, r.bottom - s.top]] : [[0, s.height]];
    const phone = matchMedia('(max-width: 760px)').matches;
    stage.style.setProperty('--handle-y', (phone ? r.bottom - s.top - 22 : r.bottom - s.top - 66) + 'px'); };
